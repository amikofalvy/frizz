name: release

# Publishes `frizz` from the `release` branch — NOT from main.
#
# WHAT CHANGED, AND WHY (2026-09-08). This published on every push to main that touched package.json.
# That is the natural shape for a repo that lands straight on main, and it worked until releasing
# became a standing automated job rather than something a human did while holding the whole tree in
# their head. The problem is that main moves under you: several agents land on it continuously, so the
# commit you verified and the commit that publishes are routinely not the same one, and a release
# carries whatever happened to arrive in between. Nobody chose to ship that work; it was simply
# adjacent.
#
# So the two questions are now separated. Main answers "has this landed?". `release` answers "has this
# been VERIFIED and chosen to ship?" — and only the second one publishes.
#
# THE BRANCH IS A FAST-FORWARD POINTER INTO MAIN, never a fork. It holds no commits of its own: you
# pick the main commit you actually tested and move `release` to it. That keeps the published tree a
# real snapshot of main with no merge to reconcile and nothing to cherry-pick, while still letting you
# leave later, unverified commits behind. If `release` ever needs a non-fast-forward push, something
# has gone wrong — stop and look rather than forcing it.
#
# THE CONSEQUENCE TO KNOW ABOUT: bumping the version on main and pushing NO LONGER PUBLISHES. It is
# inert until `release` is moved. That silence is deliberate, but it is silence, so the procedure lives
# in plans/runtime-pin-bumps.md and the check for an unshipped bump runs on the daily runtime watch.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN, no secret to rotate or leak. That binds the
# right to publish to THIS repository and THIS workflow file — the filename is load-bearing, and
# renaming release.yml breaks publishing until the trusted publisher is reconfigured on npmjs.com. It
# does NOT bind a branch (npm's trusted publisher takes org, repo, workflow filename and an optional
# environment, and this workflow declares no environment), which is what makes publishing from
# `release` work at all. Trusted publishing attaches provenance automatically; --provenance is
# unnecessary.

on:
  push:
    branches: [release]
    # NO path filter, deliberately — it was `paths: [package.json]` and that is wrong for this branch.
    # A path filter tests the files changed IN THE PUSHED RANGE, and `release` advances by
    # fast-forwarding over several main commits at once, so the version bump is normally somewhere in
    # the middle of the range rather than in its diff — and on the push that CREATES the branch there
    # is no range at all. Measured 2026-09-08: neither the creating push nor the next fast-forward
    # fired, and both releases had to be dispatched by hand.
    #
    # Dropping the filter costs nothing, because the workflow is already idempotent by construction:
    # it asks the registry whether this version exists and no-ops when it does. `release` only ever
    # moves when someone means to publish, so a run per move is exactly right.
  # Still here for the case it was written for: finishing a release that died AFTER the publish.
  workflow_dispatch:

# Two releases racing would fight over the same version; let an in-flight one finish rather than
# cancelling it mid-publish.
concurrency:
  group: release-frizz
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
      contents: write # tag the released commit and create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          # Without an explicit registry-url npm has no registry to exchange the OIDC token against.
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1. Node 26 ships a new enough npm today; upgrading
      # explicitly keeps this workflow correct if the bundled npm ever regresses.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # A release must not be the first time the tree is compiled. The full suite is deliberately NOT
      # a gate here: it drives real provider CLIs and has never run on a CI box, so making it block
      # publishing would break releases for reasons unrelated to the release. (It used to drive tmux
      # too; that transport is gone.)
      - name: Typecheck
        run: pnpm run typecheck

      - name: Resolve versions and decide what to publish
        id: decide
        run: |
          SHELL_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server-release/package.json').version")
          echo "version=$SHELL_VERSION" >> "$GITHUB_OUTPUT"
          echo "server_version=$SERVER_VERSION" >> "$GITHUB_OUTPUT"
          # Registry checks, rather than commit diffs, make retries idempotent. Server releases are
          # intentionally independent: a compatible runtime fix can publish without moving the shell.
          if npm view "frizz-server@$SERVER_VERSION" version > /dev/null 2>&1; then
            echo "frizz-server@$SERVER_VERSION is already published"
            echo "publish_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "frizz-server@$SERVER_VERSION is not on the registry; publishing"
            echo "publish_server=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "frizz@$SHELL_VERSION" version > /dev/null 2>&1; then
            echo "frizz@$SHELL_VERSION is already published"
            echo "publish_shell=false" >> "$GITHUB_OUTPUT"
          else
            echo "frizz@$SHELL_VERSION is not on the registry; publishing"
            echo "publish_shell=true" >> "$GITHUB_OUTPUT"
          fi

      # Root prepack stages this package before either pack operation. `--ignore-scripts` makes the
      # server tarball exactly the staging that the shell's local artifact tests consume; it avoids a
      # second, package-directory lifecycle that cannot see the source workspace.
      - name: Build and publish frizz-server to npm
        if: steps.decide.outputs.publish_server == 'true'
        run: |
          node ./scripts/prepare-package.mjs --server
          node ./scripts/build-package.mjs --server
          npm publish --ignore-scripts ./packages/server-release

      # Shell prepack creates its launcher bundle, leaves server staging intact for future standalone
      # packs, and strips workspace-only development links from the root manifest.
      - name: Publish frizz shell to npm
        if: steps.decide.outputs.publish_shell == 'true'
        run: npm publish

      # Tags and GitHub releases belong to the stable shell only. This reconciliation deliberately
      # runs even when the registry check skipped publishing: a retry after npm accepted the tarball
      # but GitHub tagging/release creation failed must repair the missing metadata. The tag target is
      # npm's recorded gitHead, never this workflow's checkout: a later server-only release can run at
      # a newer commit while the shell version remains unchanged.
      - name: Tag the released shell commit
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already tagged; nothing to do"
            exit 0
          fi
          GIT_HEAD=$(npm view "frizz@$VERSION" gitHead)
          if ! printf '%s' "$GIT_HEAD" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "frizz@$VERSION has no valid npm gitHead; refusing to tag this workflow checkout" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$GIT_HEAD"
          git cat-file -e "$GIT_HEAD^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$GIT_HEAD" -m "frizz v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub shell release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the v$VERSION release already exists; nothing to do"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "frizz v$VERSION" \
            --notes "Published to npm: https://www.npmjs.com/package/frizz/v/$VERSION" \
            --verify-tag
